name: CI

on:
  push:
    branches: [dev, "feature/**"]
  pull_request:
    branches: [dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          DATABASE_URL: postgresql://aromatica:local@localhost:5432/aromatica?schema=public
          JWT_SECRET: ci-validation-secret-at-least-32-characters
