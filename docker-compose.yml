services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aromatica
      POSTGRES_PASSWORD: aromatica
      POSTGRES_DB: aromatica
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aromatica -d aromatica"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    # Mejora de Ivan: sin volúmenes de código ni WATCHPACK_POLLING; corre el build de producción de la imagen.
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
